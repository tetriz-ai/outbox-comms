include classpath("application.conf")
node-address { protocol = http, host = localhost, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
queues {
  e2e-requests { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 0 seconds }
  e2e-dispatch { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 0 seconds }
  e2e-feedback { defaultVisibilityTimeout = 3 seconds, receiveMessageWait = 0 seconds }
}
